server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: every non-file path serves the app shell.
  location / {
    try_files $uri /index.html;
  }

  # /api is proxied by the platform (Cloud Run service-to-service or a load
  # balancer route) — not by this container.
}
